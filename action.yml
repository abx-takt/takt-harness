name: 'takt-harness measure'
description: 'Measure a command (and optionally a baseline) with takt-harness: wall time, CPU counters where available, output hash. Writes a readings bundle.'
author: 'TAKT'
branding:
  icon: 'activity'
  color: 'blue'
inputs:
  command:
    description: 'The command to measure, with arguments (shell words).'
    required: true
  baseline:
    description: 'Optional baseline command measured in interleaved rounds; the run also compares outputs and timings against it.'
    required: false
    default: ''
  reps:
    description: 'Measured runs per command.'
    required: false
    default: '9'
  warmup:
    description: 'Unmeasured warm-up runs per command.'
    required: false
    default: '1'
  counters:
    description: 'Use hardware counters (true) or wall time only (false). GitHub-hosted runners usually have no counters.'
    required: false
    default: 'false'
  out:
    description: 'Path of the readings bundle.'
    required: false
    default: 'readings.json'
  version:
    description: 'takt-harness release tag to download.'
    required: false
    default: 'v0.2.1'
  fail-on-regression:
    description: 'With a baseline: fail the step when outputs differ or the compare step reports a slowdown.'
    required: false
    default: 'false'
outputs:
  readings:
    description: 'Path of the readings bundle.'
    value: ${{ steps.run.outputs.readings }}
runs:
  using: 'composite'
  steps:
    - name: Download takt-harness
      shell: bash
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/takt-harness"; mkdir -p "$dir"; cd "$dir"
        base="https://github.com/abx-takt/takt-harness/releases/download/${{ inputs.version }}"
        curl -sSLO "$base/takt-harness-x86_64-linux"
        curl -sSLO "$base/SHA256SUMS"
        sha256sum -c SHA256SUMS
        chmod +x takt-harness-x86_64-linux
        echo "$dir" >> "$GITHUB_PATH"
    - name: Measure
      id: run
      shell: bash
      env:
        TH_COMMAND: ${{ inputs.command }}
        TH_BASELINE: ${{ inputs.baseline }}
        TH_REPS: ${{ inputs.reps }}
        TH_WARMUP: ${{ inputs.warmup }}
        TH_COUNTERS: ${{ inputs.counters }}
        TH_OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        flags="--reps $TH_REPS --warmup $TH_WARMUP --out $TH_OUT"
        if [ "$TH_COUNTERS" != "true" ]; then flags="$flags --no-counters"; fi
        # inputs are shell words (quotes allowed); eval re-parses them exactly as a shell line would
        if [ -n "$TH_BASELINE" ]; then
          eval "takt-harness-x86_64-linux run $flags --label baseline --label new -- $TH_BASELINE ::: $TH_COMMAND"
        else
          eval "takt-harness-x86_64-linux run $flags -- $TH_COMMAND"
        fi
        echo "readings=$TH_OUT" >> "$GITHUB_OUTPUT"
        takt-harness-x86_64-linux show "$TH_OUT" | head -n 60
    - name: Compare with the baseline
      if: ${{ inputs.baseline != '' }}
      shell: bash
      env:
        TH_OUT: ${{ inputs.out }}
        TH_FAIL: ${{ inputs.fail-on-regression }}
      run: |
        set -euo pipefail
        if [ "$TH_FAIL" = "true" ]; then
          takt-harness-x86_64-linux compare "$TH_OUT"
        else
          takt-harness-x86_64-linux compare "$TH_OUT" || true
        fi
